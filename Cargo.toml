[workspace]
resolver = "3"
members = ["rkb", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
repository = "https://github.com/tamnd/rukernel-bench"
homepage = "https://github.com/tamnd/rukernel-bench"
authors = ["tamnd <tamnd87@gmail.com>"]
publish = true

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
